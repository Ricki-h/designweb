<!DOCTYPE html>
<html lang="pt-br" 
    x-data="{ 
        tab: 'home', 
        dark: false 
    }"
    :data-theme="dark ? 'dracula' : 'winter'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPA</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
</head>
<body class="min-h-screen transition-colors">
    <nav class="navbar bg-base-100 shadow-lg px-8">
        <div class="flex-1 font-bold text-xl">DevPortfolio</div>
        
        <div class="flex-none gap-2">
          <!-- Botão HOME -->
          <button 
            @click="tab = 'home'" 
            class="btn btn-sm btn-ghost"
            :class="{ 'btn-active': tab === 'home' }">
            Home
          </button>
      
          <!-- Botão PROJETOS -->
          <button 
            @click="tab = 'projetos'" 
            class="btn btn-sm btn-ghost"
            :class="{ 'btn-active': tab === 'projetos' }">
            Projetos
          </button>

          <!-- Botão SOBRE -->
          <button 
            @click="tab = 'sobre'" 
            class="btn btn-sm btn-ghost"
            :class="{ 'btn-active': tab === 'sobre' }">
            Sobre
          </button>
          
          <!-- Botão CONTATO -->
          <button 
            @click="tab = 'contato'" 
            class="btn btn-sm btn-ghost"
            :class="{ 'btn-active': tab === 'contato' }">
            Contato
          </button>
          
          <!-- Dark Mode Toggle -->
          <input type="checkbox" class="toggle" 
                 x-model="dark" />
        </div>
      </nav>

      <main class="p-10 max-w-5xl mx-auto" :class="{ 'flex justify-center': tab === 'contato' }">

        <!-- SEÇÃO HOME -->
        <div x-show="tab === 'home'" 
             x-transition:enter.duration.500ms>
             
            <div class="hero min-h-[50vh] bg-base-200 rounded-box">
                <div class="hero-content text-center">
                    <div class="max-w-md">
                        <h1 class="text-5xl font-bold">Olá, eu sou Dev</h1>
                        <button @click="tab = 'contato'" 
                                class="btn btn-primary mt-6">
                            Fale Comigo
                        </button>
                    </div>
                </div>
            </div>
    
        </div>
    
        <section class="grid grid-cols-2 mt-10" x-show="tab === 'projetos'" x-transition:enter.duration.500ms>
            <div class="card bg-base-100 shadow-xl" x-data="{ modal: false }">
                <div class="card-body">
                  <h2 class="card-title">Projeto X</h2>
                  <button @click="modal = true" class="btn btn-primary">Ver</button>
                </div>
              
                <!-- O MODAL -->
                <div x-show="modal" 
                     class="fixed inset-0 bg-black/80 flex justify-center items-center z-50"
                     x-transition.opacity>
                     
                     <div @click.outside="modal = false" 
                          class="bg-base-100 p-8 rounded-lg flex gap-6 items-center">
                        <h3>Detalhes...</h3>
                        <button @click="modal = false" class="btn">X</button>
                     </div>
                </div>
              </div>
              <div class="card bg-base-100 shadow-xl" x-data="{ modal: false }">
                <div class="card-body">
                  <h2 class="card-title">Projeto X</h2>
                  <button @click="modal = true" class="btn btn-primary">Ver</button>
                </div>
              
                <!-- O MODAL -->
                <div x-show="modal" 
                     class="fixed inset-0 bg-black/80 flex justify-center items-center z-50"
                     x-transition.opacity>
                     
                     <div @click.outside="modal = false" 
                          class="bg-base-100 p-8 rounded-lg flex gap-6 items-center">
                        <h3>Detalhes...</h3>
                        <button @click="modal = false" class="btn">X</button>
                     </div>
                </div>
              </div>
        </section>
        
        <section x-show="tab === 'sobre'" x-transition:enter.duration.500ms>
            <h1 class="text-3xl font-bold">Perguntas frequentes</h1>
            <div class="mt-4" x-data="{ ativo: 1 }">
                <div class="collapse collapse-arrow bg-base-200 rounded-none">
                    <input type="radio" name="acc" @click="ativo = 1"/>
                    <div class="collapse-title text-xl font-medium">Minha Experiência</div>
                    <div class="collapse-content"><p>Desenvolvedor Web Fullstack.</p></div>
                </div>
                <div class="collapse collapse-arrow bg-base-100 rounded-none">
                    <input type="radio" name="acc" @click="ativo = 2"/>
                    <div class="collapse-title text-xl font-medium">Formação</div>
                    <div class="collapse-content"><p>Infórmatica no IFRN</p></div>
                </div>
                <div class="collapse collapse-arrow bg-base-200 rounded-none">
                    <input type="radio" name="acc" @click="ativo = 1"/>
                    <div class="collapse-title text-xl font-medium">Minha Experiência</div>
                    <div class="collapse-content"><p>Desenvolvedor Web Fullstack.</p></div>
                </div>
            </div>
        </section>

        <section class="bg-base-200 p-8 rounded-xl w-100" x-show="tab === 'contato'" x-transition:enter.duration.500ms x-data="{ email: '', msg: '', enviado: false }">
            <label class="floating-label w-full">
                <span>Email:</span>
                <input type="text" placeholder="mail@site.com" class="w-full input input-md" x-model="email"/>
            </label>
            <div class="form-control mt-4 flex flex-col gap-2 w-full">
                <label class="label">Mensagem</label>
                <textarea x-model="msg" class="w-full textarea textarea-bordered"></textarea>
            </div>
            <div class="mt-6">
                <button @click="enviado = true; email=''; msg=''" 
                        :disabled="!email.includes('@') || msg.length < 5"
                        class="btn btn-primary w-full">Enviar</button>
            </div>

            <div x-show="enviado" x-transition class="alert alert-success mt-4 shadow-lg">
                <span>Mensagem enviada com sucesso!</span>
            </div>
        </section>
    </main>
</body>
</html>
