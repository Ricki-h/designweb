<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro Layouts e Alinhamento Consistente</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <section class="p-6 grid justify-center">
        <div class="items-center grid grid-cols-2 p-6 bg-slate-100 shadow-lg rounded  max-w-200">
            <div>
                <h1 class="text-slate-900 text-3xl font-bold mb-1">
                    Lorem ipsum dolor sit amet 
                </h1>
                <h2 class="text-slate-900 text-2xl mb-">
                    Consectetur adipisicing elit
                </h2>
                <p class="text-slate-500">
                    Lorem ipsum dolor sit amet consectetur adipisicing elit. Odit commodi ratione corrupti deleniti quibusdam hic quos eos incidunt a reprehenderit ipsam provident odio, numquam consequuntur tempora eveniet alias praesentium explicabo!
                </p>
    
            </div>
            <div class="border-l-10 border-l-slate-300">
                <img src="https://picsum.photos/400" alt="Imagem aleatória" class="shadow-inner">
            </div>
        </div>
    </section>
    <!-- Fiz tanto com flex quanto ocm grid, mas decidi deixar com grid para testar algo novo -->
</body>
</html>
