<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex 18</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="p-4">
    <div x-data="{ tudo: false, texto: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Ut eget eros quis risus euismod eleifend. Duis mollis varius faucibus. Aenean consectetur, sem non rutrum condimentum, felis mauris viverra ligula, eget cursus nibh urna ac est. Morbi aliquam efficitur nisl, finibus consectetur felis maximus sed. Nam nunc libero, blandit a sapien vitae, viverra tincidunt leo. Vestibulum viverra felis ac dignissim mattis. Suspendisse vitae mi quis ex convallis consectetur.' }">
        <span class=" max-w-100" x-text="tudo ? texto : texto.substring(0, 100) + '...'"></span>
        <button class="text-blue-600 hover:cursor-pointer" @click="tudo = !tudo" x-text="tudo ? 'Ler menos' : 'Ler mais'"></button>
</body>
</html>
