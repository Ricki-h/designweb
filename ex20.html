<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex 20</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex flex-col items-center p-10 bg-[#171212] min-h-screen gap-10">
    <h1 class="text-4xl font-bold text-[#F20123] shadow">Galeria da Kemi, a Fantasma</h1>
    <div class=" grid grid-cols-2 gap-10">
        <div x-data="{ zoom: false }">
            <img src="imgs/kemi1.webp" @mouseenter="zoom = true" @mouseleave="zoom = false" :class="{'scale-110': zoom}" class="w-100 hover:cursor-pointer transition duration-300">
        </div>
        <div x-data="{ zoom: false }">
            <img src="imgs/kemi2.webp" @mouseenter="zoom = true" @mouseleave="zoom = false" :class="{'scale-110': zoom}" class="w-60 hover:cursor-pointer transition duration-300">
        </div>
        <div x-data="{ zoom: false }">
            <img src="imgs/kemi3.webp" @mouseenter="zoom = true" @mouseleave="zoom = false" :class="{'scale-110': zoom}" class="w-100 hover:cursor-pointer transition duration-300">
        </div>
        <div x-data="{ zoom: false }">
            <img src="imgs/kemi4.jpg" @mouseenter="zoom = true" @mouseleave="zoom = false" :class="{'scale-110': zoom}" class="w-100 hover:cursor-pointer transition duration-300">
        </div>
    </div>
</html>
