<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex 16</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="p-4">
    <div x-data="{ tab: 1 }" class="flex flex-col gap-3">
        <div>
            <button class="btn" @click="tab = 1">Tab 1</button>
            <button class="btn btn-primary" @click="tab = 2">Tab 2</button>
            <button class="btn btn-secondary" @click="tab = 3">Tab 3</button>
        </div>
        <div>
            <div x-show="tab == 1" class="p-4 bg-base-100">Conteúdo da tab 1</div>
            <div x-show="tab == 2" class="p-4 bg-base-200">Conteúdo da tab 2</div>
            <div x-show="tab == 3" class="p-4 bg-base-300">Conteúdo da tab 3</div>
        </div>
    </div>
</body>
</html>
