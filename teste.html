<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semana 11</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="p-6">
    <div x-data="{ tags: ['HTML'], newTag: '' }" class=" flex flex-col max-w-50 gap-3">
        <!-- push: inserir um novo item da lista -->
        <input x-model="newTag" @keydown.enter="tags.push(newTag); newTag=''">
        <div  class="flex gap-2">
            <!-- Lista os itens em uma lista de dados composta por manipulação -->
            <template x-for="tag in tags">
                <span class="badge badge-primary">
                    <span x-text="tag" class="font-medium"></span>
                    <button @click="tags = tags.filter(t => t !== tag)" class="text-xs hover:cursor-pointer">X</button>
                </span>
            </template>
            
        </div>
    </div> 
</body>
</html>
