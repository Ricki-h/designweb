<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semana 11</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="p-6">
    <div x-data="{ name: 'IFRN' }">
        <h1>Olá, <span x-text="name"></span></h1>
    </div>

    <div x-data="{ aceso: false }">
        <button @click="aceso = !aceso">Interruptor</button>
        luz: <span x-text="aceso ? '💡' : '🌑'"></span>
    </div>
    <br>

    <div x-data="{ msg: '' }">
        <input x-model="msg" type="text" placeholder="Digite...">
        <p>Você digitou: <b x-text="msg"></b></p>
    </div>

    <div x-data="{ n1: 0, n2: 0 }">
        <input type="number" x-model="n1">
        +
        <input type="number" x-model="n2">
        = 
        <span x-text="parseInt(n1) + parseInt(n2)"
        :class="{
            'text-red-500': (parseInt(n1) + parseInt(n2)) > 10,
            'text-blue-500': (parseInt(n1) + parseInt(n2)) <= 10
        }"></span>
    </div>

    
</body>
</html>
