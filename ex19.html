<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex 19</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="p-4">
    <div x-data="{ color: 'green' }">
        <button @click="color = color === 'green' ? 'yellow' : color === 'yellow' ? 'red' : 'green'" class="btn btn-primary">Mudar cor</button>
        <p class="font-bold text-xl mt-4" x-text="color.toUpperCase()" :class="{'text-green-500': color === 'green',
        'text-yellow-500': color === 'yellow',
        'text-red-400': color === 'red'}"></p>
</body>
</html>
